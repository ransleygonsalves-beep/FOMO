    html, body { margin:0; padding:0; height:100%; overflow:hidden; }
    #root { height:100%; }
    * { box-sizing:border-box; }
/* =============================================================
   FOMO Design System — Tokens
   Colors and Typography
   -----------------------------------------------------------
   Source: FOMO Brand Guidelines (Color Palette + Primary
   Typography sheets). Primary palette is Black / White /
   Flamingo Pink / Beige (warm cream). Secondary palette adds
   muted greens that nod to the tropical-foliage motif.
   ============================================================= */

/* ---- Webfonts ----
   DM Serif Display + DM Sans served locally from licensed brand TTFs in fonts/.
   DM Sans uses a variable TTF (upright) and a separate italic variable TTF. */
@font-face {
  font-family: "DM Serif Display";
  src: url("fomo/fonts/DMSerifDisplay-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "DM Serif Display";
  src: url("fomo/fonts/DMSerifDisplay-Italic.ttf") format("truetype");
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: "DM Sans";
  src: url("fomo/fonts/DMSans-VariableFont_opsz_wght.ttf") format("truetype-variations");
  font-weight: 100 1000;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "DM Sans";
  src: url("fomo/fonts/DMSans-Italic-VariableFont_opsz_wght.ttf") format("truetype-variations");
  font-weight: 100 1000;
  font-style: italic;
  font-display: swap;
}

:root {
  /* ============================================================
     COLOR — PRIMARY PALETTE
     Black, White, Flamingo Pink, Beige (warm cream)
     ============================================================ */
  --fomo-black: #111111;            /* Pantone Black 6 C */
  --fomo-white: #ffffff;            /* Pantone White / 11-0601 TCX */
  --fomo-pink:  #fcc9ca;            /* Pantone 700 C — Flamingo Pink */
  --fomo-beige: #f9f4e8;            /* Pantone 9183 C — warm cream */

  /* ---- Pink scale (derived from Flamingo Pink) ----
     Useful for tints, hover/press states, soft fills. */
  --fomo-pink-50:  #fff5f5;
  --fomo-pink-100: #ffe5e6;
  --fomo-pink-200: #fcc9ca;          /* base */
  --fomo-pink-300: #f7adaf;
  --fomo-pink-400: #ec8b8e;
  --fomo-pink-500: #d96f72;          /* deepened, button-press */
  --fomo-pink-600: #b85356;

  /* ---- Beige / Cream scale ---- */
  --fomo-beige-50:  #fefcf6;
  --fomo-beige-100: #f9f4e8;         /* base */
  --fomo-beige-200: #f1eada;
  --fomo-beige-300: #e6dcc4;

  /* ---- Black / Neutral scale ----
     Anchored to Pantone Black 6 C, then warmed slightly. */
  --fomo-ink-900: #111111;           /* base black */
  --fomo-ink-800: #1f1f1f;
  --fomo-ink-700: #333333;
  --fomo-ink-500: #5b5b5b;
  --fomo-ink-400: #8a8a8a;
  --fomo-ink-300: #b8b8b8;
  --fomo-ink-200: #dcdcdc;
  --fomo-ink-100: #ececec;
  --fomo-ink-50:  #f6f6f6;

  /* ============================================================
     COLOR — SECONDARY PALETTE
     Tropical foliage greens, used sparingly as accents.
     ============================================================ */
  --fomo-green-light: #eaf4df;
  --fomo-green-dark:  #738c70;

  /* ============================================================
     SEMANTIC TOKENS
     Use these in product surfaces; refer to primitives above
     only when defining new components.
     ============================================================ */

  /* Surfaces */
  --bg:           var(--fomo-beige);     /* default page background — warm cream */
  --bg-alt:       var(--fomo-beige-50);  /* lifted surface, modal bg */
  --bg-inverse:   var(--fomo-black);     /* black panels, hero blocks */
  --bg-accent:    var(--fomo-pink);      /* pink hero / promo blocks */
  --bg-soft:      var(--fomo-pink-50);   /* very soft pink wash */
  --bg-leaf:      var(--fomo-green-light); /* leafy section background */

  /* Foreground / text */
  --fg:           var(--fomo-ink-900);   /* primary text */
  --fg-1:         var(--fomo-ink-900);   /* alias */
  --fg-2:         var(--fomo-ink-700);   /* body text */
  --fg-3:         var(--fomo-ink-500);   /* secondary / captions */
  --fg-4:         var(--fomo-ink-400);   /* tertiary / disabled */
  --fg-on-dark:   var(--fomo-white);
  --fg-on-pink:   var(--fomo-black);
  --fg-on-beige:  var(--fomo-black);
  --fg-accent:    var(--fomo-green-dark);

  /* Borders & dividers */
  --border:        var(--fomo-ink-200);
  --border-strong: var(--fomo-ink-900);
  --hairline:      var(--fomo-ink-100);

  /* Brand actions */
  --brand:         var(--fomo-black);    /* primary CTA */
  --brand-hover:   var(--fomo-ink-800);
  --brand-press:   var(--fomo-ink-700);
  --brand-soft:    var(--fomo-pink);
  --brand-soft-hover: var(--fomo-pink-300);

  /* Status (kept on-brand: soft, warm) */
  --success:       #6f8f6c;              /* echoes secondary green */
  --warning:       #c98a3a;
  --danger:        #b85356;              /* deepened flamingo */
  --info:          #5b6e7a;

  /* ============================================================
     TYPOGRAPHY — FAMILIES
     Brand uses DM Serif Display for headlines, DM Sans for
     copy. No mono spec in source — using DM Mono fallback.
     ============================================================ */
  --font-display: "DM Serif Display", "Playfair Display", Georgia, serif;
  --font-sans:    "DM Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono:    "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* ---- Type scale (display-leaning, brand book style) ---- */
  --fs-display-1: clamp(56px, 7vw, 96px);
  --fs-display-2: clamp(40px, 5vw, 72px);
  --fs-h1:        clamp(36px, 4vw, 56px);
  --fs-h2:        clamp(28px, 3vw, 40px);
  --fs-h3:        24px;
  --fs-h4:        20px;
  --fs-body:      16px;
  --fs-body-sm:   14px;
  --fs-caption:   12px;
  --fs-eyebrow:   12px;

  /* ---- Weights ---- */
  --fw-regular: 400;
  --fw-medium:  500;
  --fw-bold:    700;

  /* ---- Line heights ---- */
  --lh-tight:   1.05;
  --lh-snug:    1.2;
  --lh-normal:  1.5;
  --lh-loose:   1.7;

  /* ---- Tracking ---- */
  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide:   0.08em;       /* eyebrow / labels — uppercase */
  --tracking-xwide:  0.18em;

  /* ============================================================
     SPACING / RADIUS / SHADOW
     Light layer to keep this file self-sufficient.
     ============================================================ */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;

  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-pill: 999px;

  --shadow-1: 0 1px 2px rgba(17,17,17,0.06);
  --shadow-2: 0 4px 12px rgba(17,17,17,0.08);
  --shadow-3: 0 12px 32px rgba(17,17,17,0.12);
  --shadow-pop: 0 24px 60px rgba(17,17,17,0.18);
}

/* =============================================================
   SEMANTIC ELEMENT STYLES
   Drop colors_and_type.css into a page and base elements
   pick up FOMO defaults automatically.
   ============================================================= */

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, .h1 {
  font-family: var(--font-display);
  font-weight: var(--fw-regular);
  font-size: var(--fs-h1);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  color: var(--fg-1);
  margin: 0;
}

h2, .h2 {
  font-family: var(--font-display);
  font-weight: var(--fw-regular);
  font-size: var(--fs-h2);
  line-height: var(--lh-snug);
  letter-spacing: var(--tracking-tight);
  color: var(--fg-1);
  margin: 0;
}

h3, .h3 {
  font-family: var(--font-display);
  font-weight: var(--fw-regular);
  font-size: var(--fs-h3);
  line-height: var(--lh-snug);
  color: var(--fg-1);
  margin: 0;
}

h4, .h4 {
  font-family: var(--font-sans);
  font-weight: var(--fw-bold);
  font-size: var(--fs-h4);
  line-height: var(--lh-snug);
  color: var(--fg-1);
  margin: 0;
}

p, .body {
  font-family: var(--font-sans);
  font-weight: var(--fw-regular);
  font-size: var(--fs-body);
  line-height: var(--lh-normal);
  color: var(--fg-2);
  margin: 0;
}

.body-sm   { font-size: var(--fs-body-sm); line-height: var(--lh-normal); color: var(--fg-2); }
.caption   { font-size: var(--fs-caption); color: var(--fg-3); }

.eyebrow {
  font-family: var(--font-sans);
  font-weight: var(--fw-bold);
  font-size: var(--fs-eyebrow);
  letter-spacing: var(--tracking-xwide);
  text-transform: uppercase;
  color: var(--fg-1);
}

.display-1 {
  font-family: var(--font-display);
  font-size: var(--fs-display-1);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
}
.display-2 {
  font-family: var(--font-display);
  font-size: var(--fs-display-2);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
}

code, .mono {
  font-family: var(--font-mono);
  font-size: 0.95em;
  background: var(--fomo-ink-50);
  padding: 0.1em 0.35em;
  border-radius: var(--radius-xs);
  color: var(--fg-1);
}

a {
  color: var(--fg-1);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  transition: opacity 160ms ease;
}
a:hover { opacity: 0.7; }

hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: var(--space-6) 0;
}
  </style>
</head>
<body>
<div id="root" style="height:100%"></div>
<div id="err" style="display:none;position:fixed;inset:0;background:#fff;color:red;padding:20px;font:14px monospace;z-index:9999;white-space:pre-wrap;overflow:auto"></div>

<script>
window.onerror = function(msg, src, line, col, err) {
  var d = document.getElementById('err');
  d.style.display = 'block';
  d.textContent = 'JS ERROR:\n' + msg + '\n\nSource: ' + src + ':' + line + ':' + col + '\n\n' + (err && err.stack ? err.stack : '');
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var d = document.getElementById('err');
  d.style.display = 'block';
  d.textContent += '\nPROMISE ERROR:\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
});
</script>

function Icon({ name, size=18, color='currentColor', stroke, variant='Linear' }) {
  const data = _ICN[name];
  if (!data) return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth="1.6" strokeLinecap="round" style={{flexShrink:0}}>
      <circle cx="12" cy="12" r="9"/>
    </svg>
  );
  if (Array.isArray(data)) {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
        xmlns="http://www.w3.org/2000/svg" style={{flexShrink:0}}>
        {data.map((d, i) => (
          <path key={i} d={d} stroke={color} strokeWidth="1.5"
            strokeLinecap="round" strokeLinejoin="round" strokeMiterlimit="10" fill="none" />
        ))}
      </svg>
    );
  }
  return (
    <svg width={size} height={size} viewBox={data.vb}
      xmlns="http://www.w3.org/2000/svg" style={{flexShrink:0}}>
      <path d={data.d} fill={color} />
    </svg>
  );
}

// ---- Eyebrow label ----
function Eyebrow({ children, color = FOMO_INK, style = {} }) {
  return (
    <div style={{
      fontFamily: 'DM Sans, system-ui', fontSize: 10.5, fontWeight: 700,
      letterSpacing: '0.18em', textTransform: 'uppercase', color,
      ...style,
    }}>{children}</div>
  );
}

// ---- Editorial hairline ----
function Hairline({ color = FOMO_HAIRLINE, style = {} }) {
  return <div style={{ height: 1, background: color, ...style }} />;
}

// ---- Section heading (display serif) ----
function SectionTitle({ children, size = 22, style = {} }) {
  return (
    <h2 style={{
      fontFamily: '"DM Serif Display", Georgia, serif', fontWeight: 400,
      fontSize: size, lineHeight: 1.1, letterSpacing: '-0.02em',
      color: FOMO_INK, margin: 0, ...style,
    }}>{children}</h2>
  );
}

// ---- Primary button (black pill, sentence case) ----
function PrimaryButton({ children, onClick, fullWidth = false, icon, size = 'md', style = {} }) {
  const padY = size === 'lg' ? 16 : size === 'sm' ? 10 : 13;
  const padX = size === 'lg' ? 22 : size === 'sm' ? 14 : 18;
  const fs = size === 'lg' ? 16 : size === 'sm' ? 13 : 14;
  return (
    <button onClick={onClick} style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
      padding: `${padY}px ${padX}px`,
      background: FOMO_INK, color: '#fff', border: 'none',
      borderRadius: 999, fontFamily: 'DM Sans, system-ui',
      fontSize: fs, fontWeight: 500, letterSpacing: '-0.005em',
      cursor: 'pointer', width: fullWidth ? '100%' : undefined,
      transition: 'transform .12s, background .12s', ...style,
    }}
    onMouseDown={(e) => e.currentTarget.style.transform = 'scale(0.98)'}
    onMouseUp={(e) => e.currentTarget.style.transform = 'scale(1)'}
    onMouseLeave={(e) => e.currentTarget.style.transform = 'scale(1)'}>
      {children}
      {icon && <Icon name={icon} size={fs + 2} />}
    </button>
  );
}

// ---- Ghost / outline button ----
function GhostButton({ children, onClick, icon, style = {} }) {
  return (
    <button onClick={onClick} style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '10px 14px', background: 'transparent', color: FOMO_INK,
      border: `1px solid ${FOMO_INK}`, borderRadius: 999,
      fontFamily: 'DM Sans, system-ui', fontSize: 13, fontWeight: 500,
      cursor: 'pointer', ...style,
    }}>
      {children}
      {icon && <Icon name={icon} size={14} />}
    </button>
  );
}

// ---- Pill / chip ----
function Pill({ children, active = false, onClick, icon, style = {} }) {
  return (
    <button onClick={onClick} style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '7px 12px',
      background: active ? FOMO_INK : 'transparent',
      color: active ? '#fff' : FOMO_INK,
      border: `1px solid ${active ? FOMO_INK : '#1a1a1a'}`,
      borderRadius: 999, fontFamily: 'DM Sans, system-ui', fontSize: 12,
      fontWeight: 500, letterSpacing: '-0.005em', cursor: 'pointer',
      whiteSpace: 'nowrap', transition: 'all .15s', ...style,
    }}>
      {icon && <Icon name={icon} size={12} />}
      {children}
    </button>
  );
}

// ---- Toggle switch (FOMO style — black on cream) ----
function Toggle({ checked, onChange }) {
  return (
    <button onClick={() => onChange(!checked)} style={{
      width: 44, height: 26, borderRadius: 999, position: 'relative',
      background: checked ? FOMO_INK : '#d6cfbe',
      border: 'none', cursor: 'pointer', padding: 0,
      transition: 'background .2s',
    }}>
      <span style={{
        position: 'absolute', top: 3, left: checked ? 21 : 3,
        width: 20, height: 20, borderRadius: '50%', background: '#fff',
        transition: 'left .2s', boxShadow: '0 1px 3px rgba(0,0,0,.15)',
      }} />
    </button>
  );
}

// ---- Image placeholder plate (editorial colored block) ----
// Used as stand-in for room photography + food photography.
// Each plate is a textured solid color with an inner hairline frame
// + a label so the plate reads as an intentional editorial illustration.
function ImagePlate({ tone = 'sand', label, sublabel, height = 140, full = false, style = {}, decor }) {
  const PALETTE = {
    sand:    { bg: '#e9d8b8', ink: '#3a2a1a', frond: '#b89564' },
    beach:   { bg: '#cfe4e3', ink: '#1f3a3a', frond: '#7faaa8' },
    sunset:  { bg: '#f0b894', ink: '#3a1f10', frond: '#c87a48' },
    leather: { bg: '#b56a4c', ink: '#2a0f06', frond: '#8a4530' },
    night:   { bg: '#1f2433', ink: '#e8d6a8', frond: '#4a5470' },
    olive:   { bg: '#aab78c', ink: '#1f2a14', frond: '#7a8a5a' },
    rose:    { bg: '#f0a8a8', ink: '#3a1014', frond: '#c87078' },
    cream:   { bg: '#f1e8c8', ink: '#3a2a14', frond: '#c8b88a' },
    curry:   { bg: '#d68a2a', ink: '#2a1a00', frond: '#8a5810' },
    forest:  { bg: '#3a5a3a', ink: '#e8f0d8', frond: '#1f3a1f' },
    porter:  { bg: '#3a2014', ink: '#e8d6a8', frond: '#1f0a05' },
    melon:   { bg: '#e87a78', ink: '#3a0a14', frond: '#b85056' },
    aqua:    { bg: '#a8d6d4', ink: '#0f2a2a', frond: '#6a9a98' },
    bronze:  { bg: '#a8794a', ink: '#2a1408', frond: '#7a4f2a' },
    moss:    { bg: '#7a8a5a', ink: '#1f2a0f', frond: '#5a6a3a' },
  };
  const p = PALETTE[tone] || PALETTE.sand;
  return (
    <div style={{
      position: 'relative', overflow: 'hidden',
      height, width: full ? '100%' : undefined,
      background: p.bg, color: p.ink,
      borderRadius: 4, ...style,
    }}>
      {/* paper grain */}
      <div style={{
        position: 'absolute', inset: 0,
        background: `radial-gradient(circle at 20% 30%, rgba(255,255,255,0.18), transparent 60%), radial-gradient(circle at 80% 80%, rgba(0,0,0,0.12), transparent 50%)`,
        mixBlendMode: 'overlay',
      }} />
      {/* abstract botanical decor */}
      <svg viewBox="0 0 200 200" preserveAspectRatio="xMaxYMin slice" style={{
        position: 'absolute', right: -20, top: -10, width: '60%', height: '110%',
        opacity: 0.55, color: p.frond,
      }}>
        {decor === 'palm' || !decor ? (
          <g fill="currentColor">
            <ellipse cx="120" cy="40" rx="6" ry="40" transform="rotate(20 120 40)" />
            <ellipse cx="140" cy="55" rx="5" ry="45" transform="rotate(45 140 55)" />
            <ellipse cx="155" cy="75" rx="5" ry="48" transform="rotate(70 155 75)" />
            <ellipse cx="105" cy="55" rx="5" ry="42" transform="rotate(-10 105 55)" />
            <ellipse cx="90" cy="80" rx="5" ry="45" transform="rotate(-35 90 80)" />
          </g>
        ) : decor === 'circle' ? (
          <g>
            <circle cx="140" cy="60" r="50" fill="none" stroke="currentColor" strokeWidth="1" />
            <circle cx="140" cy="60" r="30" fill="currentColor" opacity="0.4" />
          </g>
        ) : decor === 'stripes' ? (
          <g stroke="currentColor" strokeWidth="2" fill="none">
            {[0,1,2,3,4,5,6,7].map(i => <line key={i} x1={120 + i*10} y1="0" x2={60 + i*10} y2="200" />)}
          </g>
        ) : null}
      </svg>
      {/* inner hairline frame */}
      <div style={{
        position: 'absolute', inset: 8,
        border: `1px solid ${p.ink}`, opacity: 0.25, pointerEvents: 'none',
        borderRadius: 2,
      }} />
      {label && (
        <div style={{
          position: 'absolute', left: 14, bottom: 12, right: 60,
          fontFamily: '"DM Serif Display", Georgia, serif',
          fontSize: 18, lineHeight: 1.05, letterSpacing: '-0.02em',
          color: p.ink,
        }}>
          {label}
          {sublabel && <div style={{
            fontFamily: 'DM Sans, system-ui', fontSize: 9, fontWeight: 600,
            letterSpacing: '0.18em', textTransform: 'uppercase',
            opacity: 0.7, marginTop: 4,
          }}>{sublabel}</div>}
        </div>
      )}
    </div>
  );

                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                }}><Icon name="plus" size={12} color="#fff" /></button>

            </div>

          </div>
        </div>
      )}

      {!onNavChange && <BottomNav active={navTab} onChange={setNavTab} />}
      {!onNavChange && <HomeIndicator />}
    </Screen>
  );
}

              position: 'relative', height: 52, borderRadius: 999,
              background: FOMO_INK, overflow: 'hidden', userSelect: 'none',
            }}>
              <div style={{
                position: 'absolute', top: 0, bottom: 0, left: 0,
                width: `calc(${slide * 100}% + 28px)`,
                background: '#ff5b24',
                transition: slide === 0 || slide === 1 ? 'width .2s' : 'none',
              }} />
              <div style={{
                position: 'absolute', inset: 0, display: 'flex',
                alignItems: 'center', justifyContent: 'center',
                color: '#fff', fontFamily: 'DM Sans, system-ui',
                fontSize: 13, fontWeight: 600, letterSpacing: '0.04em',
                opacity: 1 - slide * 1.3,
              }}>
                {slide >= 0.95 ? 'Paying…' : 'Slide to pre-order & pay via'}
                <span style={{ marginLeft: 6, fontFamily: '"DM Serif Display", serif', fontSize: 16, fontStyle: 'italic' }}>Vipps</span>
              </div>
              <button onMouseDown={startDrag} onTouchStart={startDrag} style={{
                position: 'absolute', top: 4, height: 44, width: 44,
                left: `calc(${slide * 100}% + ${slide === 1 ? -48 : 4}px)`,
                transition: slide === 0 || slide === 1 ? 'left .2s' : 'none',
                borderRadius: 999, background: '#fff', border: 'none', cursor: 'grab',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: '0 2px 8px rgba(0,0,0,0.2)',
              }}>
                <Icon name={slide >= 0.95 ? 'check' : 'arrow_right'} size={20} color="#ff5b24" />
              </button>
            </div>
          </div>
          {/* ---- Add to tab link ---- */}
          <div style={{ textAlign: 'center', paddingTop: 12, paddingBottom: 14 }}>
            <button onClick={() => setNavTab('tab')} style={{
              background: 'transparent', border: 'none', cursor: 'pointer',
              fontFamily: 'DM Sans, system-ui', fontSize: 12, fontWeight: 600,
              color: FOMO_INK_2, letterSpacing: '0.04em',
              textDecoration: 'none',
            }}>
              Add to tab instead
            </button>
          </div>
        </div>
      )}

      {!onNavChange && <BottomNav active={navTab} onChange={setNavTab} />}
      {!onNavChange && <HomeIndicator />}
    </Screen>
  );
}

<script>
(function() {
  var showErr = function(msg) {
    var d = document.getElementById('err');
    d.style.display = 'block';
    d.textContent = msg;
  };
  var run = function() {
    if (!window.Babel) { setTimeout(run, 50); return; }
    var src = document.getElementById('app-code').textContent;
    var out;
    try {
      out = Babel.transform(src, { presets: ['react'] });
    } catch(e) {
      showErr('BABEL COMPILE ERROR:\n' + e.message + '\n\n' + (e.stack||''));
      return;
    }
    try {
      var fn = new Function(out.code);
      fn();
    } catch(e) {
      showErr('RUNTIME ERROR:\n' + e.message + '\n\n' + (e.stack||''));
    }
  };
  run();
})();
</script>
